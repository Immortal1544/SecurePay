spring.application.name=securepay

spring.datasource.url=jdbc:mysql://localhost:3306/securepay
spring.datasource.username=root
# DB_PASSWORD must be provided as an environment variable and must not be committed to source control.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT_SECRET must be provided as an environment variable and must not be committed to source control.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}